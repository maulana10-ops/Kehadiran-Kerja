<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Absensi Kerja Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Library untuk Generate PDF Slip Gaji -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Library Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --text:      #1a2340;
            --text-sub:  #5b6a8a;
            --text-dim:  #9aa5bc;

            --glass-bg:     rgba(255,255,255,0.38);
            --glass-bg-hi:  rgba(255,255,255,0.55);
            --glass-border: rgba(255,255,255,0.70);
            --glass-shadow: 0 8px 32px rgba(80,100,180,0.12);
            --glass-spec:   rgba(255,255,255,0.85);
            --glass-edge-a: rgba(255,140,200,0.10);
            --glass-edge-b: rgba(120,180,255,0.10);
            --modal-bg:     rgba(255,255,255,0.72);
            --input-bg:     rgba(255,255,255,0.55);

            --bg-grad-1: #fce4ec; --bg-grad-2: #e8eaf6; --bg-grad-3: #e0f7fa;
            --bg-grad-4: #f3e5f5; --bg-grad-5: #e8f5e9; --bg-grad-6: #fff8e1;
            --bg-grad-7: #fce4ec; --bg-grad-8: #e3f2fd;
            --body-blob-1: rgba(108,92,231,0.14);
            --body-blob-2: rgba(0,206,201,0.12);

            --hadir:    #0cb97a; --hadir-bg: rgba(12,185,122,0.14); --hadir-gl: rgba(12,185,122,0.30);
            --libur:    #f04060; --libur-bg: rgba(240,64,96,0.13); --libur-gl: rgba(240,64,96,0.28);
            --sakit:    #e8920a; --sakit-bg: rgba(232,146,10,0.14); --sakit-gl: rgba(232,146,10,0.28);
            --izin:     #2f9de8; --izin-bg:  rgba(47,157,232,0.13); --izin-gl:  rgba(47,157,232,0.28);
            --accent:   #6c5ce7; --accent-2: #a29bfe; --accent-bg: rgba(108,92,231,0.14); --accent-gl: rgba(108,92,231,0.30);
        }

        .dark-theme {
            --text:      #f8f9fa;
            --text-sub:  #cbd5e1;
            --text-dim:  #94a3b8;

            --glass-bg:     rgba(15, 23, 42, 0.45);
            --glass-bg-hi:  rgba(30, 41, 59, 0.6);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.4);
            --glass-spec:   rgba(255, 255, 255, 0.05);
            --glass-edge-a: rgba(255,255,255,0.03);
            --glass-edge-b: rgba(255,255,255,0.03);
            --modal-bg:     rgba(15, 23, 42, 0.85);
            --input-bg:     rgba(30, 41, 59, 0.7);

            --bg-grad-1: #0f172a; --bg-grad-2: #1e1b4b; --bg-grad-3: #172554;
            --bg-grad-4: #2e1065; --bg-grad-5: #064e3b; --bg-grad-6: #451a03;
            --bg-grad-7: #0f172a; --bg-grad-8: #172554;
            --body-blob-1: rgba(108,92,231,0.25);
            --body-blob-2: rgba(0,206,201,0.2);
        }

        html, body { overflow-x: hidden; width: 100%; min-height: 100vh; transition: background 0.5s ease, color 0.5s ease; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text); display: flex; justify-content: center;
            background: linear-gradient(-45deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3), var(--bg-grad-4), var(--bg-grad-5), var(--bg-grad-6), var(--bg-grad-7), var(--bg-grad-8));
            background-size: 500% 500%; animation: bgFloat 18s ease infinite;
        }
        @keyframes bgFloat { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        body::before, body::after {
            content: ''; position: fixed; border-radius: 50%; filter: blur(70px); pointer-events: none; z-index: 0;
            animation: blobMove 20s ease-in-out infinite alternate; transition: background 0.5s ease;
        }
        body::before { width: 380px; height: 380px; background: var(--body-blob-1); top: -80px; left: -80px; }
        body::after { width: 320px; height: 320px; background: var(--body-blob-2); bottom: -60px; right: -60px; animation-delay: -10s; }
        @keyframes blobMove { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px,30px) scale(1.1); } 100% { transform: translate(-20px,50px) scale(0.95); } }

        .glass {
            position: relative; background-color: var(--glass-bg);
            background-image: radial-gradient(120% 70% at 18% -15%, var(--glass-spec) 0%, transparent 52%), radial-gradient(90% 60% at 100% 115%, var(--glass-edge-b) 0%, transparent 60%), radial-gradient(70% 50% at -10% 100%, var(--glass-edge-a) 0%, transparent 55%), linear-gradient(115deg, rgba(255,255,255,0.10) 0%, transparent 28%, transparent 72%, rgba(255,255,255,0.05) 100%);
            background-size: 100% 100%, 100% 100%, 100% 100%, 220% 220%; background-position: 0 0, 0 0, 0 0, 0% 50%;
            backdrop-filter: blur(20px) saturate(1.7); -webkit-backdrop-filter: blur(20px) saturate(1.7);
            border: 1.5px solid var(--glass-border);
            box-shadow: var(--glass-shadow), inset 0 1.5px 1px var(--glass-spec), inset 0 -10px 18px -14px rgba(0,0,0,0.3);
            animation: liquidDrift 13s ease-in-out infinite; transition: all 0.3s ease;
        }
        @keyframes liquidDrift { 0%, 100% { background-position: 0 0, 0 0, 0 0, 0% 50%; } 50% { background-position: 0 0, 0 0, 0 0, 100% 50%; } }
        
        .container { position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 22px 16px 40px; display: flex; flex-direction: column; gap: 14px; overflow-x: hidden; }
        .container > * { animation: fadeUp 0.5s cubic-bezier(0.34,1.1,0.64,1) both; }
        .container > *:nth-child(1) { animation-delay: 0.05s; } .container > *:nth-child(2) { animation-delay: 0.1s; } .container > *:nth-child(3) { animation-delay: 0.15s; } .container > *:nth-child(4) { animation-delay: 0.2s; } .container > *:nth-child(5) { animation-delay: 0.25s; } .container > *:nth-child(6) { animation-delay: 0.3s; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }

        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px; }
        .topbar-eyebrow { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 3px; }
        .topbar-title { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em; color: var(--text); line-height: 1.1; }
        .topbar-title em { font-style: normal; background: linear-gradient(120deg, var(--accent) 0%, #fd79a8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        
        .topbar-actions { display: flex; gap: 6px; }
        .btn-act { width: 38px; height: 38px; border-radius: 12px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); transition: 0.2s; }
        .btn-act:active { transform: scale(0.86); }
        .btn-act svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .sync-status { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.66rem; font-weight: 600; color: var(--text-dim); padding: 0 4px 4px; }
        .sync-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); }
        .sync-status.online { color: var(--hadir); } .sync-status.online .dot { background: var(--hadir); box-shadow: 0 0 6px var(--hadir-gl); animation: pulse 2s infinite; }
        
        #monthSelect, #yearSelect { display: none; }
        .month-nav { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-radius: 20px; }
        .nav-arrow { width: 40px; height: 40px; border-radius: 12px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-sub); transition: 0.2s; z-index: 10; }
        .nav-arrow:active { transform: scale(0.84); }
        .nav-arrow svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .month-center { text-align: center; flex: 1; }
        
        #monthDisplayContainer { overflow: hidden; position: relative; height: 32px; }
        #monthDisplay { font-size: 1.6rem; font-weight: 800; color: var(--text); line-height: 1; position: absolute; width: 100%; top: 0; left: 0;}
        .month-year { font-family: 'Space Mono', monospace; font-size: 0.78rem; color: var(--text-dim); margin-top: 5px; }

        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
        .stat-chip { border-radius: 16px; padding: 14px 8px 12px; text-align: center; cursor: pointer; transition: 0.2s; }
        .stat-chip:active { transform: scale(0.94); }
        .stat-num { font-family: 'Space Mono', monospace; font-size: 1.55rem; font-weight: 700; line-height: 1; display: block; }
        .stat-chip.hadir .stat-num { color: var(--hadir); } .stat-chip.libur .stat-num { color: var(--libur); } .stat-chip.lembur .stat-num { color: var(--accent); }
        .stat-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; color: var(--text-dim); margin-top: 6px; display: block; }

        .calendar-wrapper { will-change: transform, opacity; touch-action: pan-x pan-y; overflow-x: hidden;}
        .day-headers { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 6px; padding: 0 2px; }
        .day-header { text-align: center; font-size: 0.62rem; font-weight: 700; text-transform: uppercase; color: var(--text-dim); padding: 4px 0; }
        .day-header.weekend { color: var(--libur); }
        
        .calendar-slider { width: 100%; transition: transform 0.3s ease-out, opacity 0.3s ease-out; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; padding: 0 2px; }
        
        .date-empty { aspect-ratio: 1; }
        .date-box { aspect-ratio: 1; border-radius: 13px; border: 1.5px solid rgba(160,170,210,0.1); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; font-weight: 700; font-size: 0.88rem; color: var(--text-sub); background: var(--input-bg); backdrop-filter: blur(6px); transition: 0.2s; user-select: none; }
        .date-box:active { transform: scale(0.84); border-radius: 20px; }
        .date-box.status-Hadir { background: var(--hadir-bg); border-color: var(--hadir-gl); color: var(--hadir); box-shadow: 0 3px 12px var(--hadir-gl); }
        .date-box.status-Libur { background: var(--libur-bg); border-color: var(--libur-gl); color: var(--libur); box-shadow: 0 3px 12px var(--libur-gl); }
        .date-box.status-Sakit { background: var(--sakit-bg); border-color: var(--sakit-gl); color: var(--sakit); box-shadow: 0 3px 12px var(--sakit-gl); }
        .date-box.status-Izin { background: var(--izin-bg); border-color: var(--izin-gl); color: var(--izin); box-shadow: 0 3px 12px var(--izin-gl); }
        .note-dot { position: absolute; top: 4px; right: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--sakit); box-shadow: 0 0 5px var(--sakit-gl); display: none; }
        .has-note .note-dot { display: block; }

        .salary-card { border-radius: 22px; padding: 20px 22px; position: relative; overflow: hidden; }
        .salary-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .salary-tag { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; color: var(--text-sub); display: flex; align-items: center; gap: 6px; }
        .salary-tag::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 5px var(--accent-2); } 50% { box-shadow: 0 0 14px var(--accent-2); } }
        .salary-periode { font-size: 0.65rem; color: var(--text-dim); font-family: 'Space Mono', monospace; }
        .salary-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; }
        .salary-row-label { font-size: 0.78rem; font-weight: 600; color: var(--text-sub); }
        .salary-row-value { font-family: 'Space Mono', monospace; font-size: 0.88rem; font-weight: 700; color: var(--text); }
        .salary-row-value .rp { font-size: 0.7rem; font-weight: 400; color: var(--text-dim); margin-right: 2px; }
        .salary-divider { height: 1px; margin: 6px 0 12px; background: linear-gradient(90deg, transparent, rgba(150,150,150,0.2), transparent); }
        .salary-total-row { display: flex; align-items: center; justify-content: space-between; }
        .salary-total-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; color: var(--text-dim); }
        .salary-amount { font-family: 'Space Mono', monospace; font-size: 1.55rem; font-weight: 700; color: var(--text); }
        .salary-sub { font-size: 0.67rem; color: var(--text-dim); margin-top: 8px; font-family: 'Space Mono', monospace; }

        .btn-pdf { width: 100%; background: var(--input-bg); border: 1.5px solid rgba(150,150,150,0.2); color: var(--text); padding: 12px; border-radius: 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.85rem; font-weight: 700; cursor: pointer; margin-top: 15px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;}
        .btn-pdf:active { transform: scale(0.96); background: var(--glass-bg-hi); }
        .btn-pdf svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 1000; align-items: flex-end; justify-content: center; }
        .modal-overlay.active { display: flex; animation: overlayIn 0.28s ease-out; }
        @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-sheet { position: relative; background: var(--modal-bg); backdrop-filter: blur(28px); border: 1.5px solid var(--glass-border); border-bottom: none; border-radius: 30px 30px 0 0; width: 100%; max-width: 440px; max-height: 92vh; overflow-y: auto; padding: 0 22px 40px; box-shadow: 0 -8px 48px rgba(0,0,0,0.2); animation: sheetUp 0.38s; }
        @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-overlay.closing .modal-sheet { animation: sheetDown 0.28s forwards; }
        @keyframes sheetDown { from { transform: translateY(0); } to { transform: translateY(100%); opacity: 0; } }

        .sheet-handle-row { display: flex; justify-content: center; padding: 14px 0 6px; }
        .sheet-handle { width: 40px; height: 4px; background: rgba(150,150,150,0.4); border-radius: 99px; }
        .sheet-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 14px 0 18px; border-bottom: 1px solid rgba(150,150,150,0.2); }
        .sheet-date-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }
        .sheet-date { font-size: 1.28rem; font-weight: 800; color: var(--text); }
        
        .field-group { margin-top: 18px; }
        .field-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; color: var(--text-dim); margin-bottom: 9px; display: block; }
        
        .status-pills { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
        .status-pill { padding: 11px 6px; border-radius: 13px; border: 1.5px solid rgba(150,150,150,0.2); background: var(--input-bg); text-align: center; cursor: pointer; font-size: 0.72rem; font-weight: 700; color: var(--text-sub); transition: 0.2s; }
        .status-pill.active-Hadir { background: var(--hadir-bg); border-color: var(--hadir); color: var(--hadir); transform: scale(1.04); }
        .status-pill.active-Libur { background: var(--libur-bg); border-color: var(--libur); color: var(--libur); transform: scale(1.04); }
        .status-pill.active-Sakit { background: var(--sakit-bg); border-color: var(--sakit); color: var(--sakit); transform: scale(1.04); }
        .status-pill.active-Izin { background: var(--izin-bg); border-color: var(--izin); color: var(--izin); transform: scale(1.04); }

        .time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .time-input, .notes-input { width: 100%; background: var(--input-bg); border: 1.5px solid rgba(150,150,150,0.2); color: var(--text); padding: 14px; border-radius: 14px; outline: none; font-family: 'Space Mono', monospace; transition: 0.2s; }
        .time-input:focus, .notes-input:focus { border-color: var(--accent); background: var(--glass-bg-hi); }
        
        .lembur-pills { display: grid; grid-template-columns: repeat(5,1fr); gap: 6px; }
        .lembur-pill { padding: 10px 4px; border-radius: 13px; border: 1.5px solid rgba(150,150,150,0.2); background: var(--input-bg); text-align: center; cursor: pointer; font-size: 0.66rem; font-weight: 700; color: var(--text-sub); transition: 0.2s; }
        .lembur-pill.active-lembur { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); transform: scale(1.04); }
        .lembur-info { margin-top: 10px; font-family: 'Space Mono', monospace; font-size: 0.78rem; font-weight: 700; color: var(--text-sub); text-align: center; padding: 10px; border-radius: 12px; background: var(--input-bg); border: 1.5px solid rgba(150,150,150,0.2); }
        
        .btn-save { width: 100%; background: linear-gradient(135deg, var(--accent) 0%, #a29bfe 100%); border: none; color: white; padding: 17px; border-radius: 16px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 22px; transition: 0.2s; opacity: 0.38; }
        .btn-save.can-save { opacity: 1; } .btn-save.can-save:active { transform: scale(0.97); }

        .loc-box { display: flex; align-items: center; gap: 10px; background: var(--input-bg); border: 1.5px solid rgba(150,150,150,0.2); padding: 10px 14px; border-radius: 14px;}
        .btn-loc { background: rgba(108,92,231,0.1); color: var(--accent); border: none; padding: 8px 12px; border-radius: 10px; font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: 0.2s;}
        .btn-loc:active { transform: scale(0.9); }
        .loc-text { font-size: 0.75rem; color: var(--text-dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .loc-text a { color: var(--izin); text-decoration: none; font-weight: bold; }

        /* TEMPLATE PDF (Diubah agar tidak blank saat diunduh) */
        #pdf-template { display: none; position: absolute; top: 0; left: 0; z-index: -99; width: 800px; padding: 50px; background: white; color: black; font-family: sans-serif; }
        .pdf-header { text-align: center; margin-bottom: 30px; }
        .pdf-header h1 { font-size: 28px; color: #2c3e50; margin-bottom: 5px; }
        .pdf-header p { font-size: 14px; color: #7f8c8d; }
        .pdf-info { display: flex; justify-content: space-between; margin-bottom: 30px; font-size: 16px; }
        .pdf-table { width: 100%; border-collapse: collapse; margin-bottom: 40px; }
        .pdf-table th, .pdf-table td { border: 1px solid #bdc3c7; padding: 12px; font-size: 16px; }
        .pdf-table th { background
